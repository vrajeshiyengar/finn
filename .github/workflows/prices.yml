name: prices
on:
  schedule:
    - cron: "45 3 * * 1-5"        # 09:15 IST
    - cron: "15,45 4-9 * * 1-5"   # 09:45-15:15 IST, every 30 min
    - cron: "15 10 * * 1-5"       # 15:45 IST (after close)
    - cron: "0 17 * * *"          # 22:30 IST (day's fund NAVs)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install --quiet cryptography==43.0.3
      - name: Refresh prices
        env:
          DASH_KEY: ${{ secrets.DASH_KEY }}
        run: python scripts/prices.py
      - name: Commit
        run: |
          git config user.name "money-dash"
          git config user.email "money-dash@users.noreply.github.com"
          git add data/prices.enc data/status.json
          git diff --cached --quiet && exit 0
          git commit -q -m "data update"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin main && exit 0; sleep 5; done
          exit 1
